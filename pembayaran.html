<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pembayaran Santri</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">

</head>


<body class="bg-light">


<nav class="navbar navbar-dark bg-success">
    <div class="container">
        <span class="navbar-brand">
            💰 Pembayaran Santri
        </span>
    </div>
</nav>



<div class="container mt-4">


<!-- Form Pembayaran -->

<div class="card shadow border-0 p-4">

<h4 class="mb-3">
Input Pembayaran
</h4>


<label class="mb-1">
Nama Santri
</label>

<select id="santri" class="form-select mb-3">

<option value="">
Pilih Santri
</option>

</select>




<label class="mb-1">
Jenis Pembayaran
</label>

<select id="jenis" 
class="form-select mb-3"
onchange="pilihPembayaran()">


<option value="">
Pilih Pembayaran
</option>


<option value="SPP">
SPP
</option>


<option value="Syahriyyah">
Syahriyyah
</option>


<option value="Infaq">
Infaq
</option>


<option value="Kas">
Kas
</option>


<option value="Beras">
Beras
</option>


</select>




<div id="berasPilihan" style="display:none">


<label>
Metode Beras
</label>


<select id="tipeBeras"
class="form-select mb-3"
onchange="aturBeras()">



<option value="uang">
💵 Uang
</option>


<option value="liter">
🌾 Beras (Liter)
</option>


</select>


</div>




<label>
Nominal
</label>


<input 
type="number"
id="nominal"
class="form-control mb-3"
placeholder="Masukkan nominal">





<button onclick="simpanPembayaran()"
class="btn btn-success w-100">

Simpan Pembayaran

</button>


</div>





<!-- Riwayat -->

<div class="card shadow border-0 p-4 mt-4">

<h5>
📜 Riwayat Pembayaran
</h5>


<ul id="riwayat"
class="list-group mt-3">


</ul>


</div>


</div>





<script>


let daftarSantri =
JSON.parse(localStorage.getItem("santri")) || [];


let pembayaran =
JSON.parse(localStorage.getItem("pembayaran")) || [];




// Dropdown santri

let selectSantri =
document.getElementById("santri");


daftarSantri.forEach((item)=>{


let option =
document.createElement("option");


option.value=item.nama;

option.textContent=item.nama;


selectSantri.appendChild(option);


});





function pilihPembayaran(){


let jenis =
document.getElementById("jenis").value;


let nominal =
document.getElementById("nominal");


let beras =
document.getElementById("berasPilihan");



beras.style.display="none";



if(jenis=="SPP"){

nominal.value=50000;

}


else if(jenis=="Syahriyyah"){

nominal.value=80000;

}


else if(jenis=="Kas"){

nominal.value=30000;

}


else if(jenis=="Beras"){

nominal.value="";

beras.style.display="block";

}


else{

nominal.value="";

}



}




function aturBeras(){


let tipe =
document.getElementById("tipeBeras").value;


let nominal =
document.getElementById("nominal");



if(tipe=="uang"){


nominal.placeholder="Masukkan nominal";

nominal.value=120000;


}

else{


nominal.value="";

nominal.placeholder=
"Masukkan jumlah liter";


}


}





function simpanPembayaran(){


let nama =
document.getElementById("santri").value;


let jenis =
document.getElementById("jenis").value;


let nominal =
document.getElementById("nominal").value;



if(!nama || !jenis || !nominal){

alert("Data belum lengkap");

return;

}



pembayaran.push({

nama,

jenis,

nominal,

tanggal:
new Date().toLocaleDateString("id-ID")

});



localStorage.setItem(
"pembayaran",
JSON.stringify(pembayaran)
);



alert("Pembayaran berhasil disimpan");


tampilkanRiwayat();


}





function tampilkanRiwayat(){


let box =
document.getElementById("riwayat");


box.innerHTML="";



if(pembayaran.length===0){


box.innerHTML=
`
<li class="list-group-item text-muted">
Belum ada transaksi
</li>
`;

return;

}



pembayaran.forEach((item)=>{


box.innerHTML +=

`
<li class="list-group-item">

<b>${item.nama}</b>

<br>

${item.jenis}

<br>

Rp ${Number(item.nominal)
.toLocaleString("id-ID")}

<br>

<small>${item.tanggal}</small>

</li>
`;

});


}



tampilkanRiwayat();


</script>


</body>

</html>
