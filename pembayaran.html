<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Pembayaran Santri</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-success">
<div class="container">
<span class="navbar-brand">💰 Pembayaran Santri</span>
</div>
</nav>


<div class="container mt-4">

<div class="card p-4 shadow">

<h4 class="mb-3">Input Pembayaran</h4>


<label>Nama Santri</label>
<select id="santri" class="form-control mb-3">
<option>Pilih Santri</option>
</select>



<label>Jenis Pembayaran</label>
<select id="jenis" class="form-control mb-3"
onchange="pilihPembayaran()">

<option value="">Pilih</option>
<option value="Syahriyyah">Syahriyyah - Rp80.000</option>
<option value="Kas">Kas - Rp30.000</option>
<option value="Beras">Beras</option>

</select>

<div id="berasPilihan" style="display:none">

<label>Pembayaran Beras</label>

<select id="tipeBeras" class="form-control mb-3"
onchange="aturBeras()">

<option value="uang">
Uang Rp120.000
</option>

<option value="beras">
Beras 10 Liter
</option>

</select>

</div>





<label>Nominal</label>

<input id="nominal"
class="form-control mb-3"
readonly>


<button class="btn btn-success w-100">
Simpan Pembayaran
</button>


</div>

</div>



<script>

function pilihPembayaran(){

let jenis=document.getElementById("jenis").value;

let nominal=document.getElementById("nominal");

let beras=document.getElementById("berasPilihan");


if(jenis=="Syahriyyah"){

nominal.value=80000;
beras.style.display="none";

}

else if(jenis=="Kas"){

nominal.value=30000;
beras.style.display="none";

}

else if(jenis=="Beras"){

beras.style.display="block";
nominal.value=120000;

}

}



function aturBeras(){

let tipe=document.getElementById("tipeBeras").value;

let nominal=document.getElementById("nominal");


if(tipe=="uang"){

nominal.value=120000;

}else{

nominal.value=0;

}

}

</script>


</body>
</html>
