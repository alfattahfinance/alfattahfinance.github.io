<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Laporan Keuangan</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>


<body>

<div class="container py-4">

    <!-- Judul -->
    <h2 class="text-success mb-4">
        📊 Laporan Keuangan
    </h2>


    <!-- Ringkasan Keuangan -->
    <div class="card shadow-sm border-0 mb-4">
        <div class="card-body">

            <h5 class="mb-3">
                Total Saldo
            </h5>

            <h2 class="text-success fw-bold" id="totalSaldo">
                Rp0
            </h2>

            <hr>


            <div class="row">

                <div class="col-12 mb-2">
                    <i class="bi bi-calendar-day text-success"></i>
                    Pemasukan Hari Ini :
                    <b id="hariIni">Rp0</b>
                </div>


                <div class="col-12 mb-2">
                    <i class="bi bi-calendar-month text-success"></i>
                    Pemasukan Bulan Ini :
                    <b id="bulanIni">Rp0</b>
                </div>


                <div class="col-12">
                    <i class="bi bi-calendar3 text-success"></i>
                    Pemasukan Tahun Ini :
                    <b id="tahunIni">Rp0</b>
                </div>

            </div>

        </div>
    </div>



    <!-- Riwayat Pembayaran -->
    <div class="card shadow-sm border-0">

        <div class="card-body">

            <h5 class="mb-3">
                Riwayat Pembayaran
            </h5>


            <div class="table-responsive">

                <table class="table table-striped">

                    <thead class="table-success">
                        <tr>
                            <th>Tanggal</th>
                            <th>Nama Santri</th>
                            <th>Jenis</th>
                            <th>Jumlah</th>
                        </tr>
                    </thead>


                    <tbody id="dataPembayaran">

                        <tr>
                            <td colspan="4" class="text-center text-muted">
                                Belum ada transaksi
                            </td>
                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>



    <!-- Tombol kembali -->
    <a href="index.html" class="btn btn-secondary mt-3 w-100">
        ← Kembali ke Dashboard
    </a>


</div>


<!-- Javascript -->
<script src="js/app.js"></script>

</body>
</html>
