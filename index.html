<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Laporan Keuangan Bulanan</title>

    
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="container py-4">

    <!-- Header -->
    <div class="card shadow-lg border-0 mb-4">
        <div class="card-body d-flex align-items-center">

            <img src="assets/IMG_1091.jpeg"
                 class="rounded-circle"
                 width="70"
                 height="70"
                 alt="Logo Ribath Madrasah Al-Fattah">

            <div class="ms-3">
                <h4 class="mb-1 text-success">
                    Ribath Madrasah Al-Fattah
                </h4>

                <small class="text-muted">
                    Laporan Keuangan Bulanan
                </small>
            </div>

        </div>
    </div>


    <!-- Total Saldo -->
    <div class="card bg-success text-white shadow-lg border-0 mb-4">
        <div class="card-body">

            <small>Total Saldo</small>

            <h1 class="fw-bold" id="totalSaldo">
                Rp0
            </h1>

            <small>
                Belum ada transaksi
            </small>

        </div>
    </div>

    <div class="row g-3 mb-4">

    <div class="col-6">
        <div class="card shadow-sm">
            <div class="card-body">
                <small>Total Santri</small>
                <h4 id="totalSantri">0</h4>
            </div>
        </div>
    </div>

    <div class="col-6">
        <div class="card shadow-sm">
            <div class="card-body">
                <small>Pemasukan</small>
                <h4 id="totalMasuk">Rp0</h4>
            </div>
        </div>
    </div>

    <div class="col-6">
        <div class="card shadow-sm">
            <div class="card-body">
                <small>Pengeluaran</small>
                <h4 id="totalKeluar">Rp0</h4>
            </div>
        </div>
    </div>

    <div class="col-6">
        <div class="card shadow-sm">
            <div class="card-body">
                <small>Sisa Beras</small>
                <h4 id="stokBeras">0 Liter</h4>
            </div>
        </div>
    </div>

</div>

<div class="card shadow-sm mb-4">
    <div class="card-body">

        <div class="row">

            <div class="col-6">

                <label>Bulan</label>

                <select id="bulan" class="form-select"></select>

            </div>

            <div class="col-6">

                <label>Tahun</label>

                <select id="tahun" class="form-select"></select>

            </div>

        </div>

    </div>
</div>

<div class="card shadow-sm mb-4">

    <div class="card-header bg-success text-white">

        Rekap Keuangan

    </div>

    <div class="table-responsive">

        <table class="table">

            <thead>

                <tr>

                    <th>Jenis</th>

                    <th>Masuk</th>

                    <th>Keluar</th>

                    <th>Saldo</th>

                </tr>

            </thead>

            <tbody id="rekap">

            </tbody>

        </table>

    </div>

</div>
    
    <!-- Menu -->
    <div class="row g-3">

        <div class="col-6">
            <a href="santri.html" class="text-decoration-none text-dark">
                <div class="card text-center shadow-sm p-3">
                    <i class="bi bi-people-fill fs-1 text-success"></i>
                    <h6 class="mt-2">Data Santri</h6>
                </div>
            </a>
        </div>

        <div class="col-6">
    <a href="pengeluaran.html" class="text-decoration-none text-dark">
        <div class="card text-center shadow-sm p-3">
            <i class="bi bi-wallet2 fs-1 text-danger"></i>
            <h6 class="mt-2">Pengeluaran</h6>
        </div>
    </a>
</div>

        <div class="col-6">
            <a href="pembayaran.html" class="text-decoration-none text-dark">
                <div class="card text-center shadow-sm p-3">
                    <i class="bi bi-cash-stack fs-1 text-success"></i>
                    <h6 class="mt-2">Pembayaran Santri</h6>
                </div>
            </a>
        </div>


        <div class="col-6">
            <a href="laporan.html" class="text-decoration-none text-dark">
                <div class="card text-center shadow-sm p-3">
                    <i class="bi bi-bar-chart-fill fs-1 text-success"></i>
                    <h6 class="mt-2">Laporan Keuangan</h6>
                </div>
            </a>
        </div>


        <div class="col-6">
            <a href="pengaturan.html" class="text-decoration-none text-dark">
                <div class="card text-center shadow-sm p-3">
                    <i class="bi bi-gear-fill fs-1 text-success"></i>
                    <h6 class="mt-2">Pengaturan</h6>
                </div>
            </a>
        </div>

    </div>

</div>

<script type="module" src="js/app.js"></script>

</body>
</html>
