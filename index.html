<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Syahriyyah Ribath Madrasah Al-Fattah</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

  <link rel="stylesheet" href="css/style.css">
</head>

<body>
<div class="container py-4">

    <div class="text-center mb-4">
        <img src="assets/IMG_1091.jpeg"
             class="rounded-circle shadow"
             width="90"
             height="90">

        <h2 class="mt-3 text-success">Syahriyyah</h2>

        <p class="text-muted">
            Ribath Madrasah Al-Fattah
        </p>
    </div>

    <div class="card shadow border-0 mb-4">
        <div class="card-body">
            <h6>Total Saldo</h6>
            <h2 class="text-success">Rp0</h2>
        </div>
    </div>

    <div class="row g-3">

        <div class="col-6">
            <div class="card text-center shadow-sm p-3">
                <i class="bi bi-people-fill fs-1 text-success"></i>
                <h6 class="mt-2">Data Santri</h6>
            </div>
        </div>

        <div class="col-6">
            <div class="card text-center shadow-sm p-3">
                <i class="bi bi-cash-stack fs-1 text-success"></i>
                <h6 class="mt-2">Pembayaran</h6>
            </div>
        </div>

        <div class="col-6">
            <div class="card text-center shadow-sm p-3">
                <i class="bi bi-bar-chart-fill fs-1 text-success"></i>
                <h6 class="mt-2">Laporan</h6>
            </div>
        </div>

        <div class="col-6">
            <div class="card text-center shadow-sm p-3">
                <i class="bi bi-gear-fill fs-1 text-success"></i>
                <h6 class="mt-2">Pengaturan</h6>
            </div>
        </div>

    </div>

</div>


<script src="js/app.js"></script>

</body>
</html>
