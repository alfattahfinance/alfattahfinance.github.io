<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard Keuangan</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">

<style>
body{
    background:#f5f6fa;
}

.card-stat{
    border:none;
    border-radius:15px;
    box-shadow:0 4px 10px rgba(0,0,0,.08);
}

.icon{
    font-size:30px;
}

.dashboard-title{
    font-weight:bold;
}
</style>

</head>

<body>

<nav class="navbar navbar-dark bg-success">
<div class="container">
<span class="navbar-brand">
🏫 Ribath Madrasah Al-Fattah
</span>
</div>
</nav>

<div class="container mt-4">

<h3 class="dashboard-title mb-4">
📊 Dashboard Keuangan
</h3>

<div class="row g-3">

<div class="col-md-3 col-6">
<div class="card card-stat p-3">
<div class="icon">👨‍🎓</div>
<h6>Total Santri</h6>
<h3 id="totalSantri">0</h3>
</div>
</div>

<div class="col-md-3 col-6">
<div class="card card-stat p-3">
<div class="icon">💵</div>
<h6>Total Pemasukan</h6>
<h3 id="totalMasuk">Rp 0</h3>
</div>
</div>

<div class="col-md-3 col-6">
<div class="card card-stat p-3">
<div class="icon">💸</div>
<h6>Total Pengeluaran</h6>
<h3 id="totalKeluar">Rp 0</h3>
</div>
</div>

<div class="col-md-3 col-6">
<div class="card card-stat p-3">
<div class="icon">💰</div>
<h6>Total Saldo</h6>
<h3 id="totalSaldo">Rp 0</h3>
</div>
</div>

</div>

<div class="row mt-3">

<div class="col-md-4">
<div class="card card-stat p-3">
<div class="icon">🌾</div>
<h6>Stok Beras</h6>
<h3 id="stokBeras">0 Liter</h3>
</div>
</div>

<div class="col-md-4">
<label class="form-label">Bulan</label>
<select id="bulan" class="form-select"></select>
</div>

<div class="col-md-4">
<label class="form-label">Tahun</label>
<select id="tahun" class="form-select"></select>
</div>

</div>

<div class="card card-stat mt-4">

<div class="card-header bg-success text-white">
📋 Rekap Keuangan
</div>

<div class="table-responsive">

<table class="table table-bordered table-hover mb-0">

<thead class="table-light">

<tr>
<th>Jenis</th>
<th>Pemasukan</th>
<th>Pengeluaran</th>
<th>Saldo</th>
</tr>

</thead>

<tbody id="rekap">

<tr>
<td colspan="4" class="text-center">
Memuat data...
</td>
</tr>

</tbody>

</table>

</div>

</div>

</div>

<script type="module" src="js/app.js"></script>

</body>
</html>
