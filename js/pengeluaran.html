<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Pengeluaran Pondok</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

</head>


<body class="bg-light">


<nav class="navbar navbar-dark bg-danger">
<div class="container">
<span class="navbar-brand">
📉 Pengeluaran Pondok
</span>
</div>
</nav>



<div class="container mt-4">


<div class="card shadow p-4">


<h4>
Input Pengeluaran
</h4>


<label class="mt-3">
Jenis Pengeluaran
</label>

<select id="jenis" class="form-control">

<option value="">
Pilih Jenis
</option>

<option value="Syahriyyah">
Syahriyyah
</option>

<option value="Kas">
Kas
</option>

<option value="Beras">
Beras
</option>

<option value="Lainnya">
Lainnya
</option>

</select>




<label class="mt-3">
Keterangan
</label>

<input 
id="keterangan"
class="form-control"
placeholder="Contoh: Belanja dapur">





<label class="mt-3">
Jumlah
</label>

<input 
type="number"
id="jumlah"
class="form-control"
placeholder="Masukkan jumlah">





<label class="mt-3">
Satuan
</label>

<select id="satuan" class="form-control">

<option value="Rupiah">
Rupiah
</option>

<option value="Liter">
Liter (Beras)
</option>

</select>




<button onclick="simpanPengeluaran()"
class="btn btn-danger mt-4">

Simpan Pengeluaran

</button>



</div>



<div class="card shadow p-4 mt-4">

<h5>
📜 Riwayat Pengeluaran
</h5>


<ul id="riwayat"
class="list-group">

</ul>


</div>



</div>



<script type="module" src="js/pengeluaran.js"></script>


</body>
</html>
